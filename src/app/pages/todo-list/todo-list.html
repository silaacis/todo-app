<div class="container-mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h2 class="text-center fw-bold text-primary mb-4 border-bottom pb-2">
            📝 Yapılacaklar
            </h2>

            <div class="d-flex justify-content-end mb-3">
                <a class="btn btn-primary" routerLink="/todo-add">Yapılacak İş Ekle</a>
            </div>
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th class="text-center">Tamamlandı mı?</th>
                        <th class="text-center">Id</th>
                        <th class="text-center">İçerik</th>
                        <th class="text-center">Oluşturulma Tarihi</th>
                        <th class="text-center">İşlemler</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let todo of todoList">
                        <td class="text-center"><input class="form-check-input" type="checkbox" [checked]="todo.isCompleted"
                                (change)="isCompleted(todo.id)"></td>
                        <td class="text-center">{{todo.id}}</td>
                        <td class="text-center"><span>{{todo.content}}</span></td>
                        <td class="text-center">{{todo.created | date:'short'}}</td>
                        <td>
                            <button (click)="delete(todo.id)" class="btn btn-danger">Sil</button>
                            <a class="btn btn-success mx-2 text-center " [routerLink]="['/todo-update',todo.id]" >Güncelle</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
